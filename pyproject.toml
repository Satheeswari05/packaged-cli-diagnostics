
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devcheck"
version = "0.1.0"
description = "A command-line system diagnostics tool"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
devcheck = "devcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
